# Values can be overridden by environment variables (set in docker-compose).

[options]
# ── Database ──────────────────────────────────────────────────────────────────
db_host = ${CORTEXONE_DB_HOST}
db_port = ${CORTEXONE_DB_PORT}
db_user = ${CORTEXONE_DB_USER}
db_password = ${CORTEXONE_DB_PASSWORD}
db_name = ${CORTEXONE_DB_NAME}
# Database name prefix for new databases created via UI
dbfilter = cortexone_.*

# ── Security ─────────────────────────────────────────────────────────────────
admin_passwd = ${CORTEXONE_ADMIN_PASSWD}
list_db = False

# ── Addons ────────────────────────────────────────────────────────────────────
addons_path = /opt/cortexone/addons,/opt/cortexone/odoo/addons

# ── Server ───────────────────────────────────────────────────────────────────
http_port = 8069
gevent_port = 8072
workers = 4
max_cron_threads = 2

# ── Logging ───────────────────────────────────────────────────────────────────
logfile = /var/log/cortexone/cortexone.log
log_level = info

# ── File storage ─────────────────────────────────────────────────────────────
data_dir = /var/lib/cortexone

# ── Disable all Odoo.com external calls ──────────────────────────────────────
# Publisher warranty / update checks / IAP
publisher_warranty_url =
# Disable the in-app apps store link
# (store_url is not an Odoo config param — blocked via nginx rule)

# ── Email ─────────────────────────────────────────────────────────────────────
smtp_server = ${CORTEXONE_SMTP_HOST}
smtp_port = ${CORTEXONE_SMTP_PORT}
smtp_user = ${CORTEXONE_SMTP_USER}
smtp_password = ${CORTEXONE_SMTP_PASSWORD}
email_from = noreply@cortexaitechnologies.com
