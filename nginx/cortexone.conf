# ── Upstream ──────────────────────────────────────────────────────────────────
upstream cortexone_app {
    server app:8069;
    keepalive 32;
}

upstream cortexone_longpoll {
    server app:8072;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name cortexone.cortexaitechnologies.com
                cortexonestage.cortexaitechnologies.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS — Production ────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name cortexone.cortexaitechnologies.com;

    ssl_certificate     /etc/nginx/ssl/cortexone.crt;
    ssl_certificate_key /etc/nginx/ssl/cortexone.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Remove "Odoo" from Server header
    server_tokens off;
    more_clear_headers Server;
    add_header Server "CortexONE" always;

    client_max_body_size 100M;
    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    # ── Block external XMLRPC/JSONRPC ─────────────────────────────────────────
    # Internal web client still uses /web/dataset/call_kw (JSON-RPC over HTTP)
    # which is NOT blocked. We only block raw /xmlrpc and /jsonrpc paths from
    # external access by restricting to internal networks if needed.
    # Uncomment below to restrict legacy RPC to internal only:
    # location ~* ^/(xmlrpc|jsonrpc) {
    #     allow 127.0.0.1;
    #     allow 10.0.0.0/8;
    #     deny all;
    #     proxy_pass http://cortexone_app;
    # }

    # ── Block Odoo.com outbound calls (store/apps endpoints) ─────────────────
    location /web/action/load {
        proxy_pass http://cortexone_app;
        proxy_set_header Host $host;
    }

    # ── Long-polling (realtime) ───────────────────────────────────────────────
    location /longpolling/ {
        proxy_pass         http://cortexone_longpoll;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Static assets (cached) ────────────────────────────────────────────────
    location ~* /web/static/ {
        proxy_cache_valid 200 7d;
        proxy_buffering   on;
        expires           7d;
        proxy_pass http://cortexone_app;
    }

    # ── All other requests ────────────────────────────────────────────────────
    location / {
        proxy_pass         http://cortexone_app;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     off;
    }
}

# ── HTTPS — Staging ───────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name cortexonestage.cortexaitechnologies.com;

    ssl_certificate     /etc/nginx/ssl/cortexonestage.crt;
    ssl_certificate_key /etc/nginx/ssl/cortexonestage.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    server_tokens off;
    add_header Server "CortexONE" always;
    client_max_body_size 100M;
    proxy_read_timeout 720s;

    location /longpolling/ {
        proxy_pass         http://cortexone_longpoll;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         http://cortexone_app;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     off;
    }
}
