name: CortexONE CI — Build & Test

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, production]
  push:
    branches: [develop, production]

permissions:
  contents: read
  packages: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Lint custom addons
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint Custom Addons
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff (linter)
        run: pip install ruff

      - name: Run ruff on custom addons
        run: ruff check addons/cortex_branding addons/cortex_api

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Build Docker image
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-22.04
    needs: lint
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repository name for Docker image tag
        id: repo
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Docker meta (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo.outputs.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: Run addon tests
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Run Addon Tests
    runs-on: ubuntu-22.04
    needs: build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cortexone
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: cortexone_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpq-dev libxml2-dev libxslt1-dev libjpeg-dev \
            libldap2-dev libsasl2-dev libcairo2-dev wkhtmltopdf

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install rlpycairo
          pip install -r requirements.txt

      - name: Run custom addon tests
        env:
          PGPASSWORD: testpassword
        run: |
          python odoo-bin \
            --database cortexone_test \
            --db_host 127.0.0.1 \
            --db_port 5432 \
            --db_user cortexone \
            --db_password testpassword \
            --addons-path addons,odoo/addons \
            --test-enable \
            --stop-after-init \
            -i cortex_branding,cortex_api \
            --log-level=warn

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4: Deploy Application (Single deployment node per branch)
  # Target Staging: develop branch -> cortexonestage.cortexaitechnologies.com
  # Target Production: production branch -> cortexone.cortexaitechnologies.com
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy Application
    runs-on: ubuntu-22.04
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/production')
    environment:
      name: ${{ github.ref == 'refs/heads/production' && 'production' || 'staging' }}
      url: ${{ github.ref == 'refs/heads/production' && 'https://cortexone.cortexaitechnologies.com' || 'https://cortexonestage.cortexaitechnologies.com' }}

    steps:
      - uses: actions/checkout@v4

      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CORTEXONE_SSH }}" > ~/.ssh/cortexone.pem
          chmod 600 ~/.ssh/cortexone.pem
          ssh-keyscan -H 130.210.25.122 >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          ENV_NAME: ${{ github.ref == 'refs/heads/production' && 'prod' || 'stage' }}
          DB_NAME: ${{ github.ref == 'refs/heads/production' && 'cortexone_prod' || 'cortexone_stage' }}
        run: |
          ssh -i ~/.ssh/cortexone.pem -o StrictHostKeyChecking=no \
            ubuntu@130.210.25.122 << ENDSSH
            set -e
            echo "=== CortexONE Deploying branch \$TARGET_BRANCH to \$ENV_NAME ==="
            cd /opt/cortexone

            git fetch origin \$TARGET_BRANCH
            git checkout \$TARGET_BRANCH
            git reset --hard origin/\$TARGET_BRANCH

            docker compose pull app
            docker compose up -d --no-deps app
            docker compose exec -T app cortexone \
              --database \$DB_NAME \
              --update cortex_branding,cortex_api \
              --stop-after-init \
              --no-http

            if [ "\$ENV_NAME" = "prod" ]; then
              docker compose exec -T nginx nginx -s reload
            fi

            echo "=== Deploy complete ==="
          ENDSSH

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/cortexone.pem
