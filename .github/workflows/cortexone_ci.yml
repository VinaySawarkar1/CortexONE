name: CortexONE CI — Build & Test

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, production]
  push:
    branches: [develop, production]

permissions:
  contents: read
  packages: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Lint custom addons
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint Custom Addons
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff (linter)
        run: pip install ruff

      - name: Run ruff on custom addons
        run: ruff check addons/cortex_branding addons/cortex_api

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Build Docker image and push to GHCR
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-22.04
    needs: lint
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repository name for Docker image tag
        id: repo
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Docker meta (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo.outputs.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: false

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: Run addon tests
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Run Addon Tests
    runs-on: ubuntu-22.04
    needs: build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cortexone
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: cortexone_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpq-dev libxml2-dev libxslt1-dev libjpeg-dev \
            libldap2-dev libsasl2-dev libcairo2-dev wkhtmltopdf

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install rlpycairo
          pip install -r requirements.txt

      - name: Run custom addon tests
        env:
          PGPASSWORD: testpassword
        run: |
          python odoo-bin \
            --database cortexone_test \
            --db_host 127.0.0.1 \
            --db_port 5432 \
            --db_user cortexone \
            --db_password testpassword \
            --addons-path addons,odoo/addons \
            --test-enable \
            --test-tags /cortex_api \
            --stop-after-init \
            -i cortex_branding,cortex_api \
            --log-level=warn

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4: Deploy Application
  #   - Pulls the pre-built GHCR image onto the remote server (no local build)
  #   - Updates config files via git pull
  #   - Runs Odoo module update
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy Application
    runs-on: ubuntu-22.04
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/production')
    environment:
      name: ${{ github.ref == 'refs/heads/production' && 'production' || 'staging' }}
      url: ${{ github.ref == 'refs/heads/production' && 'https://cortexone.cortexaitechnologies.com' || 'https://cortexonestage.cortexaitechnologies.com' }}

    steps:
      - name: Compute image tag
        id: repo
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "${{ secrets.CORTEXONE_SSH }}" | tr -d '\r' > ~/.ssh/cortexone.pem
          chmod 600 ~/.ssh/cortexone.pem
          ssh-keyscan -H 130.210.25.122 >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          ENV_NAME: ${{ github.ref == 'refs/heads/production' && 'prod' || 'stage' }}
          DB_NAME: ${{ github.ref == 'refs/heads/production' && 'cortexone_prod' || 'cortexone_stage' }}
          GHCR_IMAGE: ${{ steps.repo.outputs.image }}:${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Pass all variables as positional args to bash -s on the remote host.
          # Inside the script: $1=BRANCH $2=ENV $3=DB $4=IMAGE $5=TOKEN
          ssh -i ~/.ssh/cortexone.pem -o StrictHostKeyChecking=no \
            ubuntu@130.210.25.122 \
            bash -s -- "$TARGET_BRANCH" "$ENV_NAME" "$DB_NAME" "$GHCR_IMAGE" "$GH_TOKEN" << 'DEPLOY'

          set -e
          BRANCH="$1"; ENV="$2"; DB="$3"; IMAGE="$4"; TOKEN="$5"

          echo "=== CortexONE Deploy ==="
          echo "  Branch: $BRANCH | Env: $ENV | DB: $DB"
          echo "  Image:  $IMAGE"

          # ── 1. Ensure the repo is cloned (for config, docker-compose, nginx) ──
          if [ ! -d "/opt/cortexone/.git" ]; then
            echo ">>> First deploy — initializing repo..."
            sudo mkdir -p /opt/cortexone
            sudo chown -R ubuntu:ubuntu /opt/cortexone
            cd /opt/cortexone
            git init
            git remote add origin https://github.com/VinaySawarkar1/CortexONE.git
          fi

          cd /opt/cortexone
          rm -f .git/index.lock
          git fetch origin "$BRANCH"
          git checkout -f -B "$BRANCH" "origin/$BRANCH"
          git reset --hard "origin/$BRANCH"

          # ── 2. Ensure .env exists ──
          if [ ! -f .env ]; then
            echo ">>> Creating .env from template — UPDATE WITH REAL VALUES!"
            cp .env.example .env
          fi

          # ── 3. Authenticate to GHCR and set image for docker compose ──
          echo "$TOKEN" | docker login ghcr.io -u github-actions --password-stdin
          export CORTEXONE_IMAGE="$IMAGE"

          # ── 4. Clean up dangling images only (preserve DB volumes!) ──
          docker image prune -f || true

          # ── 5. Pull new image then do a clean restart of all services ──
          # Pull first (while old containers still run = zero extra downtime on pull)
          docker compose pull app
          # Now stop ALL services so nginx releases ports before we re-bind
          docker compose down --remove-orphans || true
          
          # Start fresh
          docker compose up -d

          # ── 6. Wait for app container to be running (max 90s) ──
          echo ">>> Waiting for cortexone_app..."
          for i in $(seq 1 18); do
            STATUS=$(docker inspect --format='{{.State.Status}}' cortexone_app 2>/dev/null || echo "missing")
            if [ "$STATUS" = "running" ]; then
              echo ">>> cortexone_app is running!"
              break
            fi
            echo "  attempt $i/18 — status=$STATUS — waiting 5s..."
            sleep 5
          done

          # ── 7. Run module update ──
          echo ">>> Running module update on $DB..."
          docker compose exec -T app cortexone \
            --database "$DB" \
            --update cortex_branding,cortex_api \
            --stop-after-init \
            --no-http || echo "WARNING: Module update returned non-zero — check logs."

          echo "=== Deploy complete ==="
          DEPLOY

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/cortexone.pem

